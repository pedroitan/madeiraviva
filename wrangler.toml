name = "madeiraviva"
compatibility_date = "2025-09-01"
main = "worker/index.ts"
workers_dev = true

# Domínios customizados: o deploy cria os registros na zona Cloudflare
# automaticamente (a zona precisa estar na conta).
routes = [
  { pattern = "ateliemadeiraviva.com", custom_domain = true },
  { pattern = "www.ateliemadeiraviva.com", custom_domain = true },
]

# Loja estática (Astro → dist/) servida como assets do Worker. Rotas /api/*
# caem no worker/index.ts (checkout Mercado Pago, webhook, situação ao vivo).
[assets]
directory = "./dist"
binding = "ASSETS"
not_found_handling = "404-page"

# Build no Cloudflare (Workers Builds):
#   Build command:  npm run build:pages
#   Deploy command: npx wrangler deploy   (usa este arquivo — sem autoconfig)
#   Production branch: master

# Situação ao vivo das obras (reserva com TTL 30 min / vendida).
[[kv_namespaces]]
binding = "SITUACAO"
id = "f8760218432f41019336917c72d84c4e"

# Segredos via `npx wrangler secret put` (nunca no repo):
#   MP_ACCESS_TOKEN     → configurado
#   MP_WEBHOOK_SECRET   → "secret" exibido ao cadastrar o webhook no painel MP
#                         (https://ateliemadeiraviva.com/api/webhook/mercadopago)
