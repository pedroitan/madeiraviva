name = "madeiraviva"
compatibility_date = "2025-09-01"
main = "worker/index.ts"

# Loja estática (Astro → dist/) servida como assets do Worker. Rotas /api/*
# caem no worker/index.ts (checkout Mercado Pago, webhook, situação ao vivo).
[assets]
directory = "./dist"
binding = "ASSETS"
not_found_handling = "404-page"

# Build no Cloudflare (Workers Builds):
#   Build command:  npm run build:pages
#   Deploy command: npx wrangler deploy   (usa este arquivo — sem autoconfig)
#   Production branch: master

# Situação ao vivo das obras (reserva com TTL 30 min / vendida).
# Criar o namespace:  npx wrangler kv namespace create SITUACAO
# e descomentar o binding abaixo com o id gerado.
# [[kv_namespaces]]
# binding = "SITUACAO"
# id = "<id-do-namespace>"

# Segredos via `npx wrangler secret put` (nunca no repo):
#   MP_ACCESS_TOKEN     → access token do Mercado Pago (prod ou teste)
#   MP_WEBHOOK_SECRET   → "secret" exibido ao cadastrar o webhook no painel MP
